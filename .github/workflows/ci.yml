name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:shared -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations + RLS tests on Postgres 16
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 >/dev/null
          # The postgres user cannot traverse /home/runner, so run from a copy it owns.
          sudo cp -r "$GITHUB_WORKSPACE" /tmp/kmb
          sudo chown -R postgres:postgres /tmp/kmb
          cd /tmp/kmb && sudo -u postgres env PGBIN=/usr/lib/postgresql/16/bin bash scripts/test-db.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions
        env:
          # The repo-root package.json is for the web app; without this Deno expects its node_modules.
          DENO_NO_PACKAGE_JSON: '1'
        run: |
          deno check */index.ts
          deno test --allow-env --allow-read _shared
