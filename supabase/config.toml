# Supabase project config (used by `supabase start` locally and as the reference for production settings).
project_id = "karjmuktbharat"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request: nothing can pull 25 lakh rows in one call.
max_rows = 100

[db]
port = 54322
major_version = 15

[db.pooler]
# PgBouncer (Supavisor) in transaction mode for serverless / edge traffic.
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 10000

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "https://karjmuktbharat.com"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 900                     # 15 minute access tokens
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.rate_limit]
sms_sent = 30                        # per hour, project wide (per-mobile limit is in send-sms-hook)
token_verifications = 30             # OTP verify attempts per 5 min per IP
token_refresh = 150

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 300

[auth.hook.send_sms]
enabled = true
uri = "https://YOUR-PROJECT.supabase.co/functions/v1/send-sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRET)"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.send-sms-hook]
verify_jwt = false
